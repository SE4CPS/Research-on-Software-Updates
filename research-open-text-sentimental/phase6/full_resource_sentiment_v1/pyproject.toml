[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "full-resource-sentiment-v1"
version = "0.1.0"
description = "Workstream 1 loaders, adapter, and historical 542 comparison"
requires-python = ">=3.9"
dependencies = [
  "vaderSentiment==3.3.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../.."]
addopts = "-q"
